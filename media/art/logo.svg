<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- FloTotemBar logo: a gold carved totem pole with spread wings, over the four elements' gems
       (earth, fire, water, air), on wowdb.dev navy.
       Source for media/art/logo_400.png, logo_64.png and media/textures/logo_64.tga. -->
  <defs>
    <radialGradient id="well" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#232b42"/>
      <stop offset="0.6" stop-color="#161b29"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3ad"/>
      <stop offset="0.45" stop-color="#e3b664"/>
      <stop offset="1" stop-color="#9c7130"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d595"/>
      <stop offset="0.5" stop-color="#e3b664" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3d595" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e3b664" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e3b664" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="368" height="368" rx="42" fill="url(#rim)"/>
  <rect x="22" y="22" width="356" height="356" rx="37" fill="url(#well)"/>
  <circle cx="200" cy="205" r="170" fill="url(#glow)"/>
  <g filter="url(#shadow)" fill="url(#gold)" stroke="#5c3c0c" stroke-width="3" stroke-linejoin="round">
    <!-- wings on the top block -->
    <path d="M150 92 C118 84 86 70 56 50 C60 64 66 74 74 82 L64 88 C72 98 80 104 90 108 L82 116 C96 122 110 126 124 128 L118 136 C128 138 140 138 150 136 Z"/>
    <path d="M250 92 C282 84 314 70 344 50 C340 64 334 74 326 82 L336 88 C328 98 320 104 310 108 L318 116 C304 122 290 126 276 128 L282 136 C272 138 260 138 250 136 Z"/>
    <!-- pole: three carved blocks -->
    <rect x="148" y="70" width="104" height="78" rx="10"/>
    <rect x="140" y="156" width="120" height="74" rx="10"/>
    <rect x="150" y="238" width="100" height="74" rx="10"/>
    <!-- base -->
    <path d="M130 320 L270 320 L284 340 L116 340 Z"/>
  </g>
  <!-- carved faces -->
  <g fill="#161b29">
    <!-- top: hawk face -->
    <path d="M168 96 l20 6 -20 6 Z"/><path d="M232 96 l-20 6 20 6 Z"/>
    <path d="M190 112 L200 136 L210 112 Z"/>
    <!-- middle: grinning face -->
    <rect x="160" y="174" width="26" height="14" rx="3"/><rect x="214" y="174" width="26" height="14" rx="3"/>
    <path d="M166 202 L234 202 L222 218 L178 218 Z"/>
    <!-- bottom: stern face -->
    <circle cx="180" cy="262" r="8"/><circle cx="220" cy="262" r="8"/>
    <rect x="178" y="284" width="44" height="9" rx="3"/>
  </g>
  <g fill="#f7e3ad" opacity="0.9">
    <rect x="186" y="206" width="6" height="8"/><rect x="198" y="206" width="6" height="8"/><rect x="210" y="206" width="6" height="8"/>
  </g>
  <!-- the four elements -->
  <g stroke="#0b0e16" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M86 300 l16 -20 16 20 -16 20 Z" fill="#b5783a"/>
    <path d="M86 226 l16 -20 16 20 -16 20 Z" fill="#e8583a"/>
    <path d="M282 226 l16 -20 16 20 -16 20 Z" fill="#4aa3e8"/>
    <path d="M282 300 l16 -20 16 20 -16 20 Z" fill="#d6e6f2"/>
  </g>
</svg>
